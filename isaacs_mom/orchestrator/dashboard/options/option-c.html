<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isaac's Mom: three-column evidence board</title>
<style>
:root{--ground:#edf0f4;--panel:#fff;--ink:#12171f;--muted:#465162;--rule:#d3d9e1;--rule-strong:#9aa4b2;
--student:#1d4fd8;--student-bg:#e4ecff;--teacher:#a8380a;--teacher-bg:#ffe8da;
--ok:#146c3a;--ok-bg:#dcf2e4;--bad:#a4201a;--bad-bg:#fde3e1;--ph:#566070;--focus:#1d4fd8;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{font-size:clamp(13px,.9vw + 2.2px,16px)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 1rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;height:100vh;overflow:hidden;display:flex;flex-direction:column}
::selection{background:#c9d8ff}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.005em}
h2{font-size:1rem}
.mono{font-family:var(--mono);font-size:.94em}
.muted{color:var(--muted)}
header.bar{display:flex;align-items:center;gap:1.25rem;padding:0 1.1rem;height:3rem;flex:none;background:var(--panel);border-bottom:1px solid var(--rule)}
header.bar h1{font-size:1.05rem}
header.bar .meta{display:flex;gap:1.1rem;color:var(--muted);font-size:.88rem;margin-left:auto}
header.bar .meta b{color:var(--ink);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;min-width:0;min-height:0}
.panel>header{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border-bottom:1px solid var(--rule)}
.panel>header .chip{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:600;letter-spacing:.02em;padding:.12rem .5rem;border-radius:3px;border:1px solid var(--rule-strong);background:#fff;color:var(--ink);white-space:nowrap}
.chip.recorded::before{content:"";width:.5rem;height:.5rem;border-radius:50%;border:2px solid var(--ink)}
.chip.live::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--ok)}
.chip.placeholder{border-style:dashed;color:var(--ph);background:repeating-linear-gradient(135deg,#fff 0 5px,#eceff3 5px 7px)}
.tag{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;font-size:.88rem;padding:.12rem .55rem;border-radius:3px;white-space:nowrap}
.tag.student{background:var(--student-bg);color:var(--student)}
.tag.teacher{background:var(--teacher-bg);color:var(--teacher)}
.tag.student::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:currentColor}
.tag.teacher::before{content:"";width:.55rem;height:.55rem;background:currentColor;transform:rotate(45deg)}
.verdict{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;padding:.12rem .55rem;border-radius:3px}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.good{background:var(--ok-bg);color:var(--ok)}
.verdict svg{width:.95em;height:.95em}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:.25rem .5rem .25rem 0;border-bottom:1px solid var(--rule)}
td{padding:.32rem .5rem .32rem 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;padding-right:0}
.ph-text{color:var(--ph)}
.skill{font-family:var(--mono);font-weight:600}
img.frame{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:#d8dde4;border-radius:3px}
.note{font-size:.84rem;color:var(--muted)}

.control{flex:none;display:flex;align-items:center;gap:.9rem;padding:.55rem 1.1rem;background:var(--teacher-bg);border-bottom:1px solid #f0c3a8}
.control.student{background:var(--student-bg);border-bottom-color:#b9cbfa}
.control .what{font-weight:650;font-size:1.05rem}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.95fr);gap:.8rem;padding:.8rem}
.col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.col>.body{padding:.7rem .8rem;display:flex;flex-direction:column;gap:.6rem;min-height:0;overflow:hidden}
.seen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.seen figure{margin:0;font-size:.76rem;color:var(--muted)}
.seen figcaption{margin-top:.15rem}
ol.log{list-style:none;margin:0;padding:0;overflow:auto;min-height:0}
ol.log li{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:.5rem;padding:.42rem .8rem;border-bottom:1px solid var(--rule);align-items:baseline}
ol.log li .n{color:var(--muted);font-size:.85rem;text-align:right}
ol.log li.student .skill{color:var(--student)}
ol.log li.teacher .skill{color:var(--teacher)}
ol.log li.event{background:#f5f7fa;font-weight:600}
ol.log li.event.take{background:var(--teacher-bg);color:var(--teacher)}
ol.log li.event.bad{background:var(--bad-bg);color:var(--bad)}
ol.log li.event .d{font-weight:400;color:inherit}
ol.log .ok{font-size:.8rem;color:var(--ok);font-weight:600}
ol.log .no{font-size:.8rem;color:var(--muted)}
.bigrate{font-size:2.2rem;font-weight:650;line-height:1}
.kv{display:flex;align-items:baseline;gap:.6rem}
</style>
<body>
<header class="bar">
  <h1>Isaac's Mom</h1>
  <span class="chip recorded" id="run-chip">Recorded</span>
  <div class="meta" id="meta"></div>
</header>

<div class="control" id="control"></div>
<main>
  <section class="panel col">
    <header><h2>What it sees</h2><span id="c1"></span></header>
    <div class="body">
      <div id="cur"></div>
      <div class="seen" id="seen"></div>
      <div class="note" id="seen-note"></div>
    </div>
  </section>
  <section class="panel col">
    <header><h2>What it decided</h2><span id="c2"></span></header>
    <ol class="log" id="log"></ol>
  </section>
  <section class="panel col">
    <header><h2>Did it work, and is it improving</h2><span id="c3"></span></header>
    <div class="body" id="proof"></div>
  </section>
</main>

$("proof").innerHTML = `<div class="kv"><span class="bigrate">${lastRound.successes}/${lastRound.n}</span><span class="note">held-out successes, ${esc(lastRound.checkpoint)}</span></div><div class="note">Start: ${first.successes}/${first.n} (${esc(first.checkpoint)}). ${improvement()}</div>${roundsTable()}<div style="margin-top:.3rem"><div class="kv" style="margin-bottom:.35rem"><b>Where models run</b>${chip("placeholder")}</div>${modelsTable()}</div>`;

</script>
